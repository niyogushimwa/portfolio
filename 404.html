<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Remy Niyogushimwa</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b16;
      --text: #e9eefb;
      --muted: #93a1b8;
      --accent: #38bdf8;
      --gradient: linear-gradient(120deg, #38bdf8 0%, #818cf8 48%, #c084fc 100%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(50rem 34rem at 80% 0%, rgba(56, 189, 248, 0.16), transparent 60%),
        radial-gradient(40rem 30rem at 10% 100%, rgba(167, 139, 250, 0.13), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }
    .card { max-width: 520px; }
    .code {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(6rem, 22vw, 11rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.06em;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      margin: 18px 0 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 28px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--gradient);
      color: #04101d;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code" aria-hidden="true">404</div>
    <h1>This page took a different path.</h1>
    <p>The page you are looking for does not exist or has moved. Let's get you back to the portfolio.</p>
    <a href="./">Back to home &rarr;</a>
  </main>
</body>
</html>
